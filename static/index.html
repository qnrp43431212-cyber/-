<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONE PIECE LIFE — 80억 분의 1</title><style>
:root{color-scheme:dark;--bg:#0b1320;--panel:#142234;--line:#293d53;--gold:#efc76d;--txt:#edf3fb;--muted:#a5b4c7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 5%,#193a55,#0b1320 48%);color:var(--txt);font:15px/1.65 system-ui,'Malgun Gothic',sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #48617a;border-radius:10px;background:#21384e;color:var(--txt);padding:10px 15px}button:hover{border-color:var(--gold)}button.primary{background:var(--gold);color:#172332;border:0;font-weight:800}button:disabled{opacity:.55;cursor:wait}input,textarea{width:100%;background:#0d1929;border:1px solid #3a5068;border-radius:10px;padding:12px;color:var(--txt)}.hidden{display:none!important}header{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#101d2bdc}header strong{font-size:19px;letter-spacing:.5px}header small{display:block;color:var(--gold);font-size:11px}.layout{display:grid;grid-template-columns:280px minmax(300px,1fr) 290px;height:calc(100vh - 68px)}aside{padding:20px;overflow:auto;background:#0f1c2bc7}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}h2{font-size:16px;color:var(--gold);margin:0 0 14px}h3{font-size:14px;margin:18px 0 7px}.stat{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:8px 0}.stat span{color:var(--muted)}.stat b{text-align:right}.pill{display:inline-block;border:1px solid #42556a;border-radius:30px;padding:2px 9px;color:var(--gold);font-size:12px}.muted{color:var(--muted)}.chat{display:flex;flex-direction:column;min-height:0}.messages{flex:1;overflow:auto;padding:24px max(20px,calc((100% - 820px)/2));display:flex;flex-direction:column;gap:18px}.bubble{white-space:pre-wrap;border:1px solid var(--line);background:#15273a;border-radius:15px;padding:17px 19px;max-width:92%;line-height:1.85}.bubble.user{align-self:flex-end;background:#253d56;max-width:78%}.who{font-size:12px;font-weight:800;color:var(--gold);margin-bottom:7px}.compose{padding:16px 24px 24px;border-top:1px solid var(--line);background:#0c1725}.compose-inner{max-width:820px;margin:auto;display:flex;gap:10px;align-items:end}.compose textarea{resize:vertical;min-height:66px;max-height:160px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.choices button{text-align:left}.center-card{max-width:620px;margin:32px auto;padding:0 18px}.auth{max-width:430px;margin:10vh auto;padding:24px}.auth input{margin-bottom:10px}.auth .actions{display:flex;gap:8px}.error{color:#ffae9d}.events{font-size:13px}.events p{border-bottom:1px solid var(--line);padding-bottom:10px}.level-choices{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.level-choices label{padding:8px;background:#192d40;border-radius:8px}input[type=checkbox]{width:auto}.footer{font-size:12px;color:var(--muted);padding-top:10px}@media(max-width:1050px){.layout{grid-template-columns:220px 1fr}.right{display:none}}@media(max-width:690px){header{padding:10px}header strong{font-size:15px}.layout{display:block;height:auto}.left{border-right:0;border-bottom:1px solid var(--line)}aside{padding:12px}.chat{height:75vh}.messages{padding:15px}.compose{padding:10px}.choices{grid-template-columns:1fr}}
</style></head><body><header><div><strong>☠ ONE PIECE LIFE</strong><small>80억 분의 1 · AI GM RPG</small></div><div><span id="aiStatus" class="pill">AI 상태 확인 중</span> <button id="logout" class="hidden">로그아웃</button></div></header>
<div id="auth" class="auth panel"><h2>나만의 원피스 인생 시작하기</h2><p class="muted">계정을 만들면 캐릭터와 대화 기록이 서버에 저장됩니다.</p><input id="username" placeholder="아이디 (영문·숫자·_ 3~24자)" autocomplete="username"><input id="password" type="password" placeholder="비밀번호 (8자 이상)" autocomplete="current-password"><div class="actions"><button class="primary" onclick="auth('register')">회원가입</button><button onclick="auth('login')">로그인</button></div><p id="authError" class="error"></p></div>
<div id="app" class="layout hidden"><aside class="left"><h2>⚔ 캐릭터 상태</h2><div id="status"></div><h3>세계 시계</h3><div id="clock" class="muted"></div><h3>저장 데이터</h3><button onclick="exportSave()">내 세이브 내려받기</button><div class="footer">원작 기준과 게임용 추정은 별도로 관리됩니다.</div></aside><main class="chat"><div id="messages" class="messages"></div><div id="setup" class="center-card hidden"></div><div id="compose" class="compose hidden"><div class="compose-inner"><textarea id="action" placeholder="어떤 행동이든 자유롭게 입력하세요. 예: 항구에 있는 해군에게 말을 건다."></textarea><button class="primary" id="send" onclick="send()">전송</button></div><div id="chatError" class="error" style="max-width:820px;margin:5px auto"></div></div></main><aside class="right"><h2>📜 원작 연표</h2><div id="canon" class="events"></div><h2>🌊 나의 역사 분기</h2><div id="branches" class="events"></div><h2>🤝 NPC 자율 행동</h2><div id="npcs" class="events"></div><h2>🧭 퀘스트</h2><div id="quests" class="events"></div></aside></div>
<script>
let state=null,busy=false,aiReady=false;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,body){const r=await fetch('/api/'+path,{method:body===undefined?'GET':'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:body===undefined?undefined:JSON.stringify(body)});let d=await r.json();if(!r.ok)throw Error(d.detail||d.error||'요청 실패');return d}
async function auth(mode){$('authError').textContent='';try{await api(mode,{username:$('username').value.trim(),password:$('password').value});await start()}catch(e){$('authError').textContent=e.message}}
async function start(){try{const d=await api('me');state=d.state;aiReady=d.ai_ready;$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');$('aiStatus').textContent=aiReady?'AI 서버 연결 설정됨':'AI 서버 연결 필요';const h=await api('history');$('messages').innerHTML='';if(h.messages.length){h.messages.forEach(m=>bubble(m.role,m.content))}else bubble('assistant','ONE PIECE LIFE에 입장합니다. 먼저 어떤 종족으로 시작하시겠습니까?');render()}catch(e){$('auth').classList.remove('hidden');$('app').classList.add('hidden')}}
function bubble(role,txt){const d=document.createElement('div');d.className='bubble '+(role==='user'?'user':'');d.innerHTML='<div class="who">'+(role==='user'?'플레이어':'⚓ AI GM')+'</div>'+esc(txt);$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight;return d}
const races=['인간','어인족','인어족','거인족','소인족','밍크족','하늘섬 주민','루나리아족','긴팔족','긴다리족','삼안족'];const factions=['해적','해군','혁명군','세계정부','시민'];const paths={'해적':['독립 해적','해적단 선원','현상금 사냥꾼'],'해군':['해군 병사','해군 장교 후보'],'혁명군':['혁명군 신입','정보원'],'세계정부':['CP5 요원','임펠 다운 간수','행정직'],'시민':['항해사','상인','의사','모험가','조선공']};
const questions=[['당신의 출신 배경은?',['평범한 항구 마을','빈민가','상인 가문','고아','해군 가족','떠돌이','귀족 가문','미지의 섬']],['가장 익숙한 경험이나 전문 분야는?',['항해','의술','정보 수집','무역','전투 훈련','요리','조선','탐험']],['어떤 전투 스타일 또는 역할을 선호하나요?',['검술','격투','저격','기동전','방어','지휘','지원','비전투']],['선호하는 무기나 장비는?',['검','권총','장총','창','주먹','도구','방어구','무기 없음']],['인생의 가장 큰 목적은?',['자유로운 항해','강해지기','소중한 사람 지키기','비밀 탐구','정의 실현','부와 명성','세계 변화','나만의 목표 직접 입력']]];
function options(items){return '<div class="choices">'+items.map(x=>'<button onclick="choose('+JSON.stringify(x).replace(/"/g,'&quot;')+')">'+esc(x)+'</button>').join('')+'</div>'}
function render(){if(!state)return;let s=state;$('status').innerHTML=s.name?`<div class="stat"><span>이름</span><b>${esc(s.name)}</b></div><div class="stat"><span>종족 / 진영</span><b>${esc(s.race)} / ${esc(s.faction)}</b></div><div class="stat"><span>레벨</span><b>${s.level}</b></div><div class="stat"><span>종합 전투력</span><b>${s.power?.toLocaleString()||'미산정'}</b></div><div class="stat"><span>HP</span><b>${s.hp} / ${s.max_hp}</b></div><div class="stat"><span>피로</span><b>${s.fatigue}%</b></div><div class="stat"><span>XP</span><b>${s.xp}</b></div><div class="stat"><span>베리</span><b>${s.berries.toLocaleString()}</b></div><div class="stat"><span>현상금</span><b>${s.bounty.toLocaleString()}</b></div><details><summary>전체 능력치</summary>${Object.entries(s.stats).map(([k,v])=>`<div class="stat"><span>${esc(k)}</span><b>${v}</b></div>`).join('')}</details>`:`<p class="muted">캐릭터 생성 중</p><p>종족: ${esc(s.race||'미선택')}<br>진영: ${esc(s.faction||'미선택')}</p>`;
$('clock').textContent=`해원력 1539년 · 루피 출항 ${s.day===0?'당일':s.day+'일 후'} · ${String(Math.floor(s.minute/60)).padStart(2,'0')}:${String(s.minute%60).padStart(2,'0')} · ${s.location}`;
$('canon').innerHTML=(s.canon_events||[]).map(e=>`<p><b>${esc(e.name)}</b><br><span class="muted">${esc(e.location)} · ${e.status==='canon_reference'?'원작 기준':'게임용 추정'}</span><br>${esc(e.access)}</p>`).join('')||'<p class="muted">현재 확인된 사건 없음</p>';
$('branches').innerHTML=(s.branches||[]).slice(-8).map(b=>`<p>${esc(b.description)}</p>`).join('')||'<p class="muted">아직 역사가 바뀌지 않았습니다.</p>';
$('npcs').innerHTML=(s.npc_memory||[]).slice(-8).map(n=>`<p><b>${esc(n.name)}</b> · ${esc(n.action)}</p>`).join('')||'<p class="muted">기록된 행동 없음</p>';
$('quests').innerHTML=(s.quests||[]).slice(-8).map(q=>`<p><b>${esc(q.title)}</b><br>${esc(q.description)}</p>`).join('')||'<p class="muted">퀘스트 없음</p>';
$('compose').classList.toggle('hidden',s.phase!=='game'||s.level_pending>0);$('setup').classList.toggle('hidden',s.phase==='game'&&!s.level_pending);
if(s.level_pending){$('setup').innerHTML=`<div class="panel"><h2>LEVEL UP! · 능력치 5개 선택</h2><p>서로 다른 5개를 선택해야 진행할 수 있습니다.</p><div class="level-choices">${Object.keys(s.stats).map(k=>`<label><input type="checkbox" name="stat" value="${esc(k)}"> ${esc(k)}</label>`).join('')}</div><p><button class="primary" onclick="levelUp()">배분 확정</button></p></div>`;return}
if(s.phase==='race')$('setup').innerHTML='<div class="panel"><h2>어떤 종족으로 시작하시겠습니까?</h2>'+options(races)+'</div>';
if(s.phase==='faction')$('setup').innerHTML='<div class="panel"><h2>진영을 선택하세요</h2>'+options(factions.filter(f=>!(s.race==='루나리아족'&&f==='세계정부')))+'</div>';
if(s.phase==='path')$('setup').innerHTML='<div class="panel"><h2>세부 경로를 선택하세요</h2>'+options(paths[s.faction])+'</div>';
if(s.phase==='questions'){const q=questions[s.answers.length];$('setup').innerHTML=`<div class="panel"><span class="pill">질문 ${s.answers.length+1} / 6</span><h2>${esc(s.faction)} · ${esc(q[0])}</h2>${options(q[1])}${s.answers.length===4?'<p><input id="custom" placeholder="직접 입력할 목표"><button onclick="chooseCustom()">직접 입력 확정</button></p>':''}</div>`}
if(s.phase==='name')$('setup').innerHTML='<div class="panel"><h2>질문 6 / 6 · 당신의 이름은?</h2><input id="characterName" maxlength="32" placeholder="캐릭터 이름"><p><button class="primary" onclick="chooseName()">이름 확정하고 게임 시작</button></p></div>';
}
async function choose(value){try{const d=await api('setup',{value});state=d.state;render();if(state.phase==='game'){bubble('assistant',state.last_scene+'\n\n이제 자유롭게 행동을 입력하세요.')} }catch(e){alert(e.message)}}
function chooseCustom(){const v=$('custom').value.trim();if(v)choose(v)}function chooseName(){const v=$('characterName').value.trim();if(v)choose(v)}
async function levelUp(){const stats=[...document.querySelectorAll('input[name=stat]:checked')].map(x=>x.value);try{const d=await api('level',{stats});state=d.state;render()}catch(e){alert(e.message)}}
async function send(){if(busy)return;let action=$('action').value.trim();if(!action)return;busy=true;$('send').disabled=true;$('chatError').textContent='';$('action').value='';bubble('user',action);const pending=bubble('assistant','AI GM이 세계의 반응을 구성하고 있습니다…');try{const d=await api('turn',{action});pending.remove();bubble('assistant',d.narrative+`\n\n[판정: ${d.outcome} · 경험치 +${d.effects.xp} · ${d.effects.minutes}분 경과]`);state=d.state;render()}catch(e){pending.remove();$('chatError').textContent=e.message;$('action').value=action}finally{busy=false;$('send').disabled=false}}
function exportSave(){location.href='/api/export'}
$('logout').onclick=async()=>{await api('logout',{});location.reload()};$('action').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});start();
</script></body></html>
